<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="alphocado" />
    <title>✨ Celestial Zodiac ✨</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=Poppins:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@1,400;1,500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Starfield Canvas -->
    <canvas id="starfield"></canvas>

    <!-- Floating particles -->
    <div class="particles" id="particles"></div>

    <section class="main" id="main">
      <div class="container">
        <section class="search">
          <div class="box">
            <div class="icon-ring">
              <span class="icon-star">✧</span>
            </div>
            <h2>Discover Your Sign</h2>
            <p class="subtitle">The stars know who you are</p>

            <div class="input-group">
              <label for="day"> <span class="label-icon">📅</span> Day </label>
              <input
                type="number"
                id="day"
                name="day"
                min="1"
                max="31"
                placeholder="1–31"
                required
              />
            </div>

            <div class="input-group">
              <label for="month">
                <span class="label-icon">🌙</span> Month
              </label>
              <select name="month" id="month">
                <option value="" disabled selected>Choose month</option>
                <option value="1">✨ January</option>
                <option value="2">✨ February</option>
                <option value="3">✨ March</option>
                <option value="4">✨ April</option>
                <option value="5">✨ May</option>
                <option value="6">✨ June</option>
                <option value="7">✨ July</option>
                <option value="8">✨ August</option>
                <option value="9">✨ September</option>
                <option value="10">✨ October</option>
                <option value="11">✨ November</option>
                <option value="12">✨ December</option>
              </select>
            </div>

            <button id="search" onclick="performSearch()">
              <span class="btn-text">Reveal My Zodiac</span>
              <span class="btn-icon">🔮</span>
            </button>
          </div>
        </section>
      </div>

      <section class="result" id="resultSection">
        <div class="result-glow"></div>
        <h2 class="result-title">Your Celestial Identity</h2>
        <div class="zodiac-card" id="zodiacCard">
          <div class="card-inner">
            <!-- Gambar default langsung diset, dengan fallback jika file tidak ditemukan -->
            <img
              src="img/default.png"
              id="result"
              alt="Zodiac Sign"
              width="300px"
              onerror="
                this.onerror = null;
                this.src =
                  'data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22200%22 height=%22200%22 viewBox=%220 0 100 100%22%3E%3Ccircle cx=%2250%22 cy=%2250%22 r=%2245%22 fill=%22none%22 stroke=%22rgba(212,168,83,0.4)%22 stroke-width=%222%22/%3E%3Cpath d=%22M50 25 L55 40 L70 40 L58 50 L62 65 L50 56 L38 65 L42 50 L30 40 L45 40 Z%22 fill=%22rgba(212,168,83,0.5)%22/%3E%3Ctext x=%2250%22 y=%2280%22 text-anchor=%22middle%22 fill=%22rgba(255,255,255,0.5)%22 font-size=%226%22%3E🔮%3C/text%3E%3C/svg%3E';
              "
            />
            <div class="zodiac-name" id="zodiacName"></div>
          </div>
        </div>
      </section>
    </section>

    <footer>
      <div class="footer-content">
        <div class="footer-stars">✦ ✧ ✦</div>
        <p>
          &copy; 2023 Alphocado — Crafted with starlight. All rights reserved.
        </p>
        <div class="footer-stars">✦ ✧ ✦</div>
      </div>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
